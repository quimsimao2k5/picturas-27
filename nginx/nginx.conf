worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1) Server principal, em HTTPS
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Configuração para o Frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Video library uploads (UC-VID-002): up to 1 GB per video (Premium),
        # streamed without buffering so the upload progress is real (REQ-VID-LIB-009).
        location /api-gateway/videos/ {
            rewrite ^/api-gateway/(.*)$ /$1 break;
            proxy_pass http://api_gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1100m;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

            if ($request_method = 'OPTIONS') {
              add_header 'Access-Control-Allow-Origin' '*';
              add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
              add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
              add_header 'Access-Control-Max-Age' 3600;
              return 204;
            }
        }

        # Configuração para o API Gateway
        location /api-gateway/ {
            rewrite ^/api-gateway/(.*)$ /$1 break;
            proxy_pass http://api_gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

           # Adicionando cabeçalhos CORS
           add_header 'Access-Control-Allow-Origin' '*' always;
           add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
           add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Project-Version, X-Caller-Id' always;
           add_header 'Access-Control-Expose-Headers' 'X-Project-Version' always;

            # Reescreve os caminhos para suportar o subpath
            sub_filter 'href="/' 'href="/api-gateway/';
            sub_filter 'src="/' 'src="/api-gateway/';
            sub_filter_once off;

           # Tratando requisições OPTIONS (preflight)
           if ($request_method = 'OPTIONS') {
             add_header 'Access-Control-Allow-Origin' '*';
             add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
             add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Project-Version, X-Caller-Id';
             add_header 'Access-Control-Max-Age' 3600;
             return 204;
           }

        }

        # Configuração para o WebSocket Gateway
        location /socket.io {
            proxy_pass http://ws_gateway:4000;
    
            # Configurações necessárias para WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout para conexões WebSocket
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Cabeçalhos adicionais
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS para WebSockets
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

            if ($request_method = 'OPTIONS') {
                return 204;
        }
         }

        # Configuração para o serviço principal de object storage (SeaweedFS S3)
        location /s3/ {
            proxy_pass http://seaweedfs:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            # Reescreve os caminhos para suportar o subpath
            # sub_filter 'href="/' 'href="/s3/';
            # sub_filter 'src="/' 'src="/s3/';
            # sub_filter_once off;
        }

        # Configuração para o console (filer web UI do SeaweedFS)
        location /s3-console/ {
            rewrite ^/s3-console/(.*) /$1 break;
            proxy_pass http://seaweedfs:8888/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            chunked_transfer_encoding off;

            # Reescreve os caminhos para suportar o subpath
            sub_filter 'href="/' 'href="/s3-console/';
            sub_filter 'src="/' 'src="/s3-console/';
            sub_filter_once off;
        }

        # # Kibana (porta 5601)
        # location /kibana-service/ {
        #     proxy_pass http://kibana:5601/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
